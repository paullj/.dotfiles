add_newline = true
command_timeout = 2000

format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$cmd_duration\
$line_break\
$character"""

continuation_prompt = "[❯❯ ](magenta)"

[fill]
symbol = " "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "blue"
read_only = ""

[git_branch]
format = " [$branch]($style)"
style = "grey"

[git_status]
format = '([ $ahead_behind$modified$untracked$staged$renamed$deleted$conflicted]($style))'
style = "cyan"
modified = "*"
staged = "+"
untracked = "?"
renamed = ""
deleted = "x"
conflicted = "!"
stashed = ""
diverged = "⇡⇣"
ahead = "⇡"
behind = "⇣"
up_to_date = ""
ignore_submodules = true

[character]
success_symbol = "[❯](magenta)"
error_symbol = "[❯](red)"

[cmd_duration]
min_time = 5000
format = "[${duration}]($style)"
style = "yellow"
show_milliseconds = false

[package]
disabled = true

[nodejs]
disabled = true

[python]
format = "[ $virtualenv]($style)"
style = "yellow"
python_binary = []

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[lua]
disabled = true

[c]
disabled = true

[docker_context]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true
